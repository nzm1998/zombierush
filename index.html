<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>ZombieRush</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-viewport">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-toolbar">
        <button id="unity-fullscreen-button" type="button" title="Fullscreen">&#9974;</button>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // The built-in Default template pins the canvas to a fixed 1280x720 CSS
      // box. On any display wider than that the browser then upscales the
      // image, which is the single biggest reason the WebGL build looked
      // blurrier than the Editor. Here the canvas is sized by CSS (100% of the
      // viewport) and Unity keeps the render target matched to the canvas DOM
      // size, so the game always renders at native resolution.
      //
      // devicePixelRatio is capped: a 4K/retina panel reports 2, which is
      // already 4x the pixels; letting a 3x phone panel through would tank the
      // frame rate for a gain nobody can see at this camera distance.
      var dprCap = 2;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #a4262c; color: #fff; padding: 10px 14px;';
        else {
          if (type == 'warning') div.style = 'background: #b58a1f; color: #fff; padding: 10px 14px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ZombieRush",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, dprCap),
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";

          var fsButton = document.querySelector("#unity-fullscreen-button");
          fsButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };

          // Browsers only allow fullscreen from a user gesture, and the canvas
          // is the thing the player will actually click, so wire it up too.
          canvas.addEventListener("dblclick", function () {
            if (!document.fullscreenElement) unityInstance.SetFullscreen(1);
          });
        }).catch(function (message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
